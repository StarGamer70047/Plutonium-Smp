<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plutonium SMP</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
  <canvas id="particles"></canvas>

<div class="glow-bg"></div>

<!-- Sidebar -->
<div class="sidebar">
  <div class="server">PS</div>
</div>

<!-- Channels -->
<div class="channels">
  <h3>PLUTONIUM SMP</h3>
  <p onclick="showSection('home')"># home</p>
  <p onclick="showSection('about')"># about</p>
  <p onclick="showSection('server')"># server-info</p>
  <p onclick="showSection('join')"># join</p>
</div>

<!-- Chat -->
<div class="chat">

  <!-- HOME -->
  <div id="home" class="section">
    <div class="message">
      <h2>⚡ Plutonium SMP</h2>
      <p>Welcome to the best Minecraft server 🚀</p>
    </div>
  </div>

  <!-- ABOUT -->
  <div id="about" class="section" style="display:none;">
    <div class="message">
      <h2>About 💬</h2>
      <p>🔥 Survival SMP</p>
      <p>🎮 Active Community</p>
      <p>⚔️ Events & Rewards</p>
    </div>
  </div>

  <!-- SERVER INFO -->
  <div id="server" class="section" style="display:none;">
    <div class="message">
      <h2>Server Info 📊</h2>
      <p>👑 Owner: Shrey</p>
      <p>👥 Total Members: 180+</p>
    </div>

    <!-- STAFF CARDS -->
    <div class="staff-container">

      <div class="staff-card">
        <h3>Herobrine</h3>
        <p>Staff</p>
      </div>

      <div class="staff-card">
        <h3>Plash</h3>
        <p>Moderator</p>
      </div>

      <div class="staff-card">
        <h3>Anshu</h3>
        <p>Manager</p>
      </div>

    </div>
  </div>

  <!-- JOIN -->
  <div id="join" class="section" style="display:none;">
    <div class="message">
      <h2>Join Now 🚀</h2>
      <a href="https://discord.gg/XmHPy5NA9U" target="_blank">
        <button class="join-btn">Join Discord</button>
      </a>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
