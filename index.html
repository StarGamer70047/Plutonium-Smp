<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plutonium Smp</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="bg"></canvas>

<div class="sidebar">
  <div class="server active">LR</div>
</div>

<div class="channels">
  <h3>SERVER</h3>
  <p onclick="showSection('home')"># home</p>
  <p onclick="showSection('chat')"># live-chat</p>
  <p onclick="showSection('voice')"># voice</p>
  <p onclick="showSection('join')"># join</p>
</div>

<div class="chat">

  <!-- HOME -->
  <div id="home" class="section">
    <div class="message fade">
      <h2>👑 Lunar Rewadz</h2>
      <p>Best Gaming Community 🚀</p>
      <span class="status online"></span> Online
    </div>
  </div>

  <!-- LIVE CHAT -->
  <div id="chat" class="section" style="display:none;">
    <div id="chatBox"></div>
    <p id="typing">User is typing...</p>
  </div>

  <!-- VOICE -->
  <div id="voice" class="section" style="display:none;">
    <div class="message">
      🎧 Voice Channel  
      <p>Users connected: 5</p>
    </div>
  </div>

  <!-- JOIN -->
  <div id="join" class="section" style="display:none;">
    <div class="message">
      <h2>Join Now 🚀</h2>
      <a href="https://discord.gg/YOUR_LINK" target="_blank">
        <button class="join-btn">Join Discord</button>
      </a>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
